# HKOS Production Configuration
# Document: DS-015 (ЭТАП 2 — Production Readiness)
# Version: 1.0.0
# Профиль: production (ConfigLoader(profile="production"))

hkos:
  version: "1.0.1"
  root: ./hkos
  enabled: true

core:
  bootstrap:
    auto_start: true
    health_check_on_start: true
  scheduler:
    enabled: false

logging:
  level: INFO
  file: ./hkos/logs/hkos.log
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  max_size_mb: 10
  backup_count: 5
  namespace: hkos

health:
  check_interval_seconds: 60
  components:
    - config
    - logger
    - registry

# ===== Retrieval Engine (DS-008) =====
# ===== Retrieval Engine (DS-008) =====
retrieval:
  ranking:
    topic_weight: 0.25
    confidence_weight: 0.15
    project_weight: 0.10
    freshness_weight: 0.10
    usage_weight: 0.05
    canonical_weight: 0.15
    references_weight: 0.05
    success_weight: 0.05
    campaign_weight: 0.05
    decision_weight: 0.05
    freshness_half_life_days: 90
    # Верхние границы нормализации факторов (0 — фактор выключен;
    # текущее поведение: usage/references/confirmations выключены,
    # активируются заданием caps — Audit Remediation DS-009A, задача 4).
    usage_cap: 0
    references_cap: 0
    confirmations_cap: 0
    # Базовое число кандидатов фазы-2 ранжирования (см. refine_limit).
    refine_limit_base: 60
  selector:
    top_n: 20
  builder:
    max_candidates: 200
    keyword_limit: 50
  traverser:
    max_depth: 1
    max_related: 10
    relation_decay: 0.8
  parser:
    projects:
      openwrt: "OpenWrt"
      phoenix contact: "Phoenix Contact"
      "phoenix": "Phoenix Contact"
      terminal blocks: "Terminal Blocks"
      hermes: "Hermes"
    topics:
      - routing
      - firewall
      - tproxy
      - dns
      - nftables
      - policy routing
      - sing-box
      - udp
      - vpn
    entities:
      - tproxy
      - tcp
      - udp
      - nftables
      - fwmark
      - sing-box
      - openwrt
      - warp
      - iptables
      - tun
    intents:
      diagnostics: ["почему", "не работает", "диагностик", "причина", "debug"]
      implementation: ["реализовать", "сделать", "настроить", "установить", "implement"]
      research: ["исследовать", "как работает", "изучить", "research"]
      architecture: ["архитектур", "спроектировать", "design"]
      comparison: ["сравнить", "vs", "или", "compare"]
      validation: ["проверить", "валидировать", "verify"]
    stopwords: ["для", "и", "в", "на", "с", "по", "из", "у", "к", "о", "что", "как", "это", "не", "при", "до", "от", "за"]

# ===== Операционный режим (DS-015 ЭТАП 2) =====
operations:
  auto_snapshot: true
  auto_index: true
  retrieve_before_task: true
  save_after_task: true
  context_profile: medium

# ===== Performance Layer (DS-013) =====
performance:
  enabled: true
  cache:
    enabled: true
    max_entries: 1000
    ttl_seconds: 3600
  context:
    compression: normal
  metrics:
    enabled: true

# ===== Backup (DS-011/DS-015) =====
backup:
  enabled: true
  keep_n: 5
